<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrafficMind - Demo</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/static/style.css">

<style>
  .benchmark {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1.5rem;
    height: 52px;
    border-bottom: 1px solid var(--border-sub);
    background: var(--surface-1);
    top: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  .logo-icon {
    width: 28px;
    height: 28px;
    background: var(--a);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-icon svg { display: block; }

  .logo-sub {
    font-size: 11px;
    font-weight: 400;
    color: var(--text);
    font-family: var(--mono);
    letter-spacing: 0.04em;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .version-tag {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text);
    letter-spacing: 0.06em;
    border: 1px solid var(--border-sub);
    border-radius: 4px;
    padding: 2px 7px;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 5px;
    background: var(--surface-2);
    border: 1px solid var(--border-sub);
    color: var(--text);
    transition: all 0.3s;
  }

  .status-pill::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text);
    transition: background 0.3s;
    flex-shrink: 0;
  }

  .status-pill.running {
    border-color: rgba(45,212,191,.3);
    color: var(--a);
    background: var(--a-glow);
  }
  .status-pill.running::before { background: var(--a); animation: pulse 1.2s ease-in-out infinite; }

  .status-pill.done {
    border-color: rgba(74,222,128,.3);
    color: var(--win);
    background: rgba(74,222,128,.08);
  }
  .status-pill.done::before { background: var(--win); }

  .status-pill.error {
    border-color: rgba(248,113,113,.3);
    color: var(--red);
    background: rgba(248,113,113,.08);
  }
  .status-pill.error::before { background: var(--red); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── MAIN LAYOUT ─────────────────────────────────────────────── */
  .main-layout {
    flex: 1;
    display: grid;
    grid-template-columns: 264px 1fr;
  }

  /* ── SIDEBAR ─────────────────────────────────────────────────── */
  aside {
    border-right: 1px solid var(--border-sub);
    background: var(--surface-1);
    padding: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    position: sticky;
    top: 52px;
  }

  .aside-block {
    padding: 1rem 1rem 0.875rem;
    border-bottom: 1px solid var(--border-sub);
  }

  .aside-block:last-of-type {
    border-bottom: none;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding-bottom: 1rem;
  }

  .section-eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-eyebrow::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-sub);
  }

  .agent-header {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 0.625rem;
  }

  .agent-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .agent-dot.a { background: var(--a); }
  .agent-dot.b { background: var(--b); }

  .agent-label-text {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .agent-label-text.a { color: var(--a); }
  .agent-label-text.b { color: var(--b); }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 6px;
  }

  .control-group:last-child { margin-bottom: 0; }

  label {
    font-size: 11px;
    color: var(--text);
    font-family: var(--mono);
  }

  select, input[type="number"] {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border-sub);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 9px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  select:hover, input[type="number"]:hover {
    border-color: var(--border-emp);
    background: var(--border-sub);
  }

  select:focus, input[type="number"]:focus {
    border-color: var(--a);
    background: var(--surface-2);
    box-shadow: 0 0 0 2px rgba(45,212,191,.15);
  }

  #models-dir-a-group, #models-dir-b-group { display: none; }

  /* Launch button */
  #launch-btn {
    width: 100%;
    padding: 9px 16px;
    background: var(--a);
    color: #0d1117;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.04em;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  #launch-btn:hover {
    opacity: 0.92;
    box-shadow: 0 0 0 3px rgba(45,212,191,.2);
  }

  #launch-btn:active { transform: scale(0.98); }
  #launch-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── CONTENT AREA ──────────────────────────────────────────── */
  .content {
    display: flex;
    flex-direction: column;
    padding: 1.5rem;
    gap: 1.25rem;
    overflow-y: auto;
  }

  /* ── IDLE STATE ─────────────────────────────────────────────── */
  #idle-msg {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    color: var(--text);
    text-align: center;
    padding: 3rem;
  }

  .idle-icon {
    width: 56px;
    height: 56px;
    border: 1px solid var(--border-sub);
    border-radius: 14px;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.25rem;
  }

  .idle-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 2px;
  }

  .idle-sub {
    font-size: 12px;
    color: var(--text);
    font-family: var(--mono);
  }

  /* ── VS BANNER ──────────────────────────────────────────────── */
  .vs-bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 1rem;
  }

  .agent-name {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .agent-name.a { color: var(--a); justify-content: center; }
  .agent-name.b { color: var(--b); justify-content: center; flex-direction: row-reverse; }

  .vs-badge {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border-sub);
    border-radius: 5px;
    padding: 4px 10px;
    white-space: nowrap;
  }

  /* ── SIM PROGRESS RAILS ─────────────────────────────────────── */
  .sim-rails {
    background: var(--surface-1);
    border: 1px solid var(--border-sub);
    border-radius: 10px;
    padding: 0.875rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sim-rails-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sim-step-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
  }

  #sim-info {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
    letter-spacing: 0.04em;
  }

  .rail-group { display: flex; flex-direction: column; gap: 5px; }

  .rail-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .rail-agent-tag {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    width: 20px;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  .rail-agent-tag.a { color: var(--a); }
  .rail-agent-tag.b { color: var(--b); }

  .rail-track {
    flex: 1;
    height: 5px;
    background: var(--border-sub);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }

  .rail-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .rail-fill.a { background: var(--a); }
  .rail-fill.b { background: var(--b); }

  .rail-val {
    font-family: var(--mono);
    font-size: 10px;
    width: 44px;
    text-align: right;
    flex-shrink: 0;
  }
  .rail-val.a { color: var(--a); }
  .rail-val.b { color: var(--b); }

  /* ── KPI GRID ───────────────────────────────────────────────── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .kpi-card {
    background: var(--surface-1);
    border: 1px solid var(--border-sub);
    border-radius: 10px;
    padding: 0.875rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: border-color 0.2s;
  }

  .kpi-card:hover { border-color: var(--border-mid); }

  .kpi-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .kpi-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.02em;
  }

  .kpi-unit-tag {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .kpi-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    align-items: end;
  }

  .kpi-side {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .kpi-side-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .kpi-side-label.a { color: var(--a); opacity: 0.75; }
  .kpi-side-label.b { color: var(--b); opacity: 0.75; text-align: right; }

  .kpi-val {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.02em;
    transition: color 0.4s;
  }

  .kpi-val.a { color: var(--a); }
  .kpi-val.b { color: var(--b); text-align: right; }
  .kpi-val.winner-a, .kpi-val.winner-b { color: var(--win); }
  .kpi-val.loser { color: var(--text) !important; }

  .kpi-bar-wrap {
    height: 3px;
    background: var(--border-sub);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
    margin-top: 2px;
  }

  .kpi-bar {
    position: absolute;
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .kpi-bar.a { left: 0; background: var(--a); opacity: 0.6; }
  .kpi-bar.b { right: 0; background: var(--b); opacity: 0.6; }

  .kpi-desc {
    font-size: 14px;
    color: var(--text);
    line-height: 1.4;
  }

  /* ── WINNER BANNER ──────────────────────────────────────────── */
  #winner-banner {
    display: none;
    background: var(--surface-1);
    border: 1px solid var(--border-sub);
    border-radius: 10px;
    padding: 1.125rem 1.5rem;
    text-align: center;
    animation: fadeUp 0.4s ease;
    position: relative;
    overflow: hidden;
  }

  #winner-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
  }

  #winner-banner.win-a::before {
    background: radial-gradient(ellipse at 50% 0%, var(--a-glow), transparent 70%);
    opacity: 1;
  }
  #winner-banner.win-b::before {
    background: radial-gradient(ellipse at 50% 0%, var(--b-glow), transparent 70%);
    opacity: 1;
  }

  #winner-banner .winner-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 5px;
  }

  #winner-banner .winner-name {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.03em;
  }

  #winner-banner .winner-reason {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
    margin-top: 5px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── EPISODE SUMMARY TABLE ──────────────────────────────────── */
  #episode-summary {
    display: none;
    background: var(--surface-1);
    border: 1px solid var(--border-sub);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    animation: fadeUp 0.5s ease;
  }

  #episode-summary .summary-header {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 0.875rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #episode-summary .summary-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-sub);
  }

  .summary-table { width: 100%; border-collapse: collapse; }

  .summary-table th {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
    padding: 0 0.625rem 0.625rem;
    text-align: right;
    border-bottom: 1px solid var(--border-sub);
  }

  .summary-table th:first-child { text-align: left; padding-left: 0; }
  .summary-table th.col-a { color: var(--a); }
  .summary-table th.col-b { color: var(--b); }

  .summary-table td {
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 0.625rem;
    text-align: right;
    border-bottom: 1px solid var(--border-sub);
    color: var(--text);
  }

  .summary-table td:first-child {
    text-align: left;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--text);
    padding-left: 0;
  }

  .summary-table tr:last-child td { border-bottom: none; }
  .summary-table td.win  { color: var(--win); font-weight: 600; }
  .summary-table td.lose { color: var(--text); }

  .summary-note {
    font-size: 10px;
    font-family: var(--mono);
    color: var(--text);
    margin-top: 0.75rem;
    text-align: center;
    letter-spacing: 0.02em;
  }

  /* ── BAR CHART SUMMARY ──────────────────────────────────────── */
  #bar-chart-summary {
    display: none;
    background: var(--surface-1);
    border: 1px solid var(--border-sub);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    animation: fadeUp 0.6s ease;
  }

  #bar-chart-summary .summary-header {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 0.875rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #bar-chart-summary .summary-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border-sub);
  }

  .bar-chart-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem 1.5rem;
  }

  .bar-chart-item { display: flex; flex-direction: column; gap: 6px; }

  .bar-chart-item-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }

  .bar-group { display: flex; flex-direction: column; gap: 4px; }

  .bar-row { display: flex; align-items: center; gap: 7px; }

  .bar-row-label {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    width: 14px;
    flex-shrink: 0;
  }
  .bar-row-label.a { color: var(--a); }
  .bar-row-label.b { color: var(--b); }

  .bar-track {
    flex: 1;
    height: 14px;
    background: var(--border-sub);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
    opacity: 0.75;
  }
  .bar-fill.a { background: var(--a); }
  .bar-fill.b { background: var(--b); }
  .bar-fill.win-a, .bar-fill.win-b { background: var(--win); opacity: 1; }

  .bar-value {
    font-family: var(--mono);
    font-size: 12px;
    width: 58px;
    text-align: right;
    flex-shrink: 0;
    color: var(--text);
  }

  .bar-value.a { color: var(--a); }
  .bar-value.b { color: var(--b); }
  .bar-value.win { color: var(--win); font-weight: 600; }
</style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────────────── -->
<header>
  <a class="nav-logo" href="home">Traffic<span>Mind</span></a>
  <nav>
    <a href="/">Overview</a>
    <a href="comparison" class="active">Comparison</a>
    <a href="results">Results</a>
    <a href="training_graph">Training Graph</a>
  </nav>
</header>

<div class="benchmark">
  <div class="logo">
    <div class="logo-icon">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <circle cx="9" cy="9" r="3.5" fill="#0d1117"/>
        <circle cx="9" cy="9" r="7" stroke="#0d1117" stroke-width="1.5"/>
        <path d="M9 2v2M9 14v2M2 9h2M14 9h2" stroke="#0d1117" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <div>TrafficMind</div>
      <div class="logo-sub">SUMO Benchmark Suite</div>
    </div>
  </div>
  <div class="header-right">
    <div class="version-tag">v1.0.0</div>
    <div class="status-pill" id="status-pill">Idle</div>
  </div>
</div>

<!-- ── MAIN ───────────────────────────────────────────────────────── -->
<div class="main-layout">

  <!-- Sidebar -->
  <aside>
    <!-- Agent A -->
    <div class="aside-block">
      <div class="section-eyebrow">Configuration</div>
      <div class="agent-header">
        <div class="agent-dot a"></div>
        <span class="agent-label-text a">Agent A</span>
      </div>
      <div class="control-group agent-a">
        <label>Policy</label>
        <select id="agent-a" onchange="toggleModelsDir('a')">
          <option value="trained_dqn">Trained DQN</option>
          <option value="fixed_time">Fixed Time</option>
          <option value="random_legal">Random Legal</option>
          <option value="greedy_queue">Greedy Queue</option>
          <option value="webster_static">Webster Static</option>
        </select>
      </div>
      <div class="control-group" id="models-dir-a-group">
        <label>Model folder</label>
        <select id="models-dir-a"></select>
      </div>
    </div>

    <!-- Agent B -->
    <div class="aside-block">
      <div class="agent-header">
        <div class="agent-dot b"></div>
        <span class="agent-label-text b">Agent B</span>
      </div>
      <div class="control-group agent-b">
        <label>Policy</label>
        <select id="agent-b" onchange="toggleModelsDir('b')">
          <option value="fixed_time">Fixed Time</option>
          <option value="trained_dqn">Trained DQN</option>
          <option value="random_legal">Random Legal</option>
          <option value="greedy_queue">Greedy Queue</option>
          <option value="webster_static">Webster Static</option>
        </select>
      </div>
      <div class="control-group" id="models-dir-b-group">
        <label>Model folder</label>
        <select id="models-dir-b"></select>
      </div>
    </div>

    <!-- Scenario -->
    <div class="aside-block">
      <div class="section-eyebrow">Scenario</div>
      <div class="control-group">
        <label>Traffic scenario</label>
        <select id="scenario">
          <option value="peak">Peak — 1,500 veh/hr</option>
          <option value="off_peak">Off-peak — 600 veh/hr</option>
        </select>
      </div>
      <div class="control-group" style="margin-top:6px">
        <label>Reward function</label>
        <select id="reward">
          <option value="local">Local</option>
          <option value="cooperative">Cooperative</option>
          <option value="fairness">Fairness</option>
          <option value="pressure_local">Pressure Local</option>
          <option value="pressure_cooperative">Pressure Cooperative</option>
          <option value="pressure_fairness">Pressure Fairness</option>
        </select>
      </div>
      <div class="control-group" style="margin-top:6px">
        <label>Random seed</label>
        <input type="number" id="seed" value="42" min="0">
      </div>
    </div>

    <!-- Launch -->
    <div class="aside-block">
      <button id="launch-btn" onclick="launch()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
          <path d="M3 2.5l8 4.5-8 4.5V2.5z"/>
        </svg>
        Run Versus
      </button>
    </div>
  </aside>

  <!-- Scoreboard -->
  <div class="content" id="content">
    <div id="idle-msg">
      <div class="idle-icon">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <circle cx="13" cy="13" r="10" stroke="#484f58" stroke-width="1.5"/>
          <circle cx="13" cy="8" r="2" fill="#4ade80"/>
          <circle cx="13" cy="13" r="2" fill="#fbbf24"/>
          <circle cx="13" cy="18" r="2" fill="#f87171"/>
        </svg>
      </div>
      <div>
        <div class="idle-title">No simulation running</div>
        <div class="idle-sub" style="margin-top:4px">Configure agents → Run Versus</div>
      </div>
      <div class="idle-sub" style="color: var(--text); margin-top:4px">Two SUMO GUI windows will open · one per agent</div>
    </div>
  </div>

</div>

<script>
// ── Load model folders ───────────────────────────────────────────────
async function loadModels() {
  try {
    const res = await fetch('/models');
    const { folders } = await res.json();
    ['models-dir-a', 'models-dir-b'].forEach(id => {
      const sel = document.getElementById(id);
      sel.innerHTML = '';
      folders.forEach(f => {
        const opt = document.createElement('option');
        opt.value = `outputs/${f}`;
        opt.textContent = f;
        sel.appendChild(opt);
      });
    });
  } catch(e) {
    console.warn('Could not load model folders', e);
  }
}

function toggleModelsDir(slot) {
  const val   = document.getElementById(`agent-${slot}`).value;
  const group = document.getElementById(`models-dir-${slot}-group`);
  group.style.display = val === 'trained_dqn' ? 'flex' : 'none';
  if (val === 'trained_dqn') group.style.flexDirection = 'column';
}

loadModels();
toggleModelsDir('a');
toggleModelsDir('b');

// ── Launch ────────────────────────────────────────────────────────────
let ws = null;

async function launch() {
  const btn = document.getElementById('launch-btn');
  btn.disabled = true;

  const agentA      = document.getElementById('agent-a').value;
  const agentB      = document.getElementById('agent-b').value;
  const modelsDirA  = document.getElementById('models-dir-a').value;
  const modelsDirB  = document.getElementById('models-dir-b').value;
  const scenario    = document.getElementById('scenario').value;
  const reward      = document.getElementById('reward').value;
  const seed        = parseInt(document.getElementById('seed').value) || 42;

  buildScoreboard(agentA, agentB);
  setPill('running', 'Running');

  await fetch('/run', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      agent_a: agentA,
      models_dir_a: agentA === 'trained_dqn' ? modelsDirA : null,
      agent_b: agentB,
      models_dir_b: agentB === 'trained_dqn' ? modelsDirB : null,
      reward, scenario, seed,
    }),
  });

  if (ws) ws.close();
  ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.finished) {
      updateScoreboard(msg.a, msg.b, true);
      setPill('done', 'Done');
      btn.disabled = false;
      ws.close();
      return;
    }
    updateScoreboard(msg.a, msg.b, false);
  };

  ws.onerror = () => {
    setPill('error', 'WS Error');
    btn.disabled = false;
  };
}

// ── Scoreboard ────────────────────────────────────────────────────────
const LIVE_KPI_CONFIG = [
  { key: 'mean_waiting_time',  label: 'Avg Wait Time',      desc: 'Mean wait of halted vehicles this step',        unit: 's',    lowerBetter: true  },
  { key: 'total_waiting_time', label: 'Lane Wait Sum',       desc: 'Sum of waiting time across all 16 lanes',       unit: 's',    lowerBetter: true  },
  { key: 'mean_queue_length',  label: 'Avg Queue Length',    desc: 'Mean halting vehicles per lane this step',      unit: 'veh',  lowerBetter: true  },
  { key: 'throughput',         label: 'Throughput',          desc: 'Cumulative vehicles that exited the network',   unit: 'veh',  lowerBetter: false },
  { key: 'switch_count',       label: 'Phase Switches',      desc: 'Cumulative signal phase changes executed',      unit: 'total',lowerBetter: true  },
  { key: 'max_lane_wait',      label: 'Max Lane Wait',       desc: 'Highest single-lane wait seen so far',          unit: 's',    lowerBetter: true  },
];

const SUMMARY_KPI_CONFIG = [
  { key: 'avg_mean_wait',  label: 'Avg Wait Time (episode mean)',    unit: 's',   lowerBetter: true  },
  { key: 'avg_mean_queue', label: 'Avg Queue Length (episode mean)', unit: 'veh', lowerBetter: true  },
  { key: 'avg_total_wait', label: 'Lane Wait Sum (episode mean)',    unit: 's',   lowerBetter: true  },
  // { key: 'throughput',     label: 'Total Throughput',                unit: 'veh', lowerBetter: false },
  { key: 'max_lane_wait',  label: 'Max Lane Wait (episode peak)',    unit: 's',   lowerBetter: true  },
  // { key: 'switch_count',   label: 'Total Phase Switches',            unit: '',    lowerBetter: true  },
];

let agentALabel = '', agentBLabel = '';
const MAX_STEPS = 900;

function agentDisplayName(key) {
  return {
    trained_dqn:    'Trained DQN',
    fixed_time:     'Fixed Time',
    random_legal:   'Random Legal',
    greedy_queue:   'Greedy Queue',
    webster_static: 'Webster Static',
  }[key] || key;
}

function buildScoreboard(agentA, agentB) {
  agentALabel = agentDisplayName(agentA);
  agentBLabel = agentDisplayName(agentB);

  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="vs-bar">
      <div class="agent-name a">
        <span id="name-a">${agentALabel}</span>
      </div>
      <div class="vs-badge">VS</div>
      <div class="agent-name b">
        <span id="name-b">${agentBLabel}</span>
      </div>
    </div>

    <div class="sim-rails">
      <div class="sim-rails-header">
        <span class="sim-step-label">Simulation progress</span>
        <span id="sim-info">Waiting for data…</span>
      </div>
      <div class="rail-group">
        <div class="rail-row">
          <span class="rail-agent-tag a">A</span>
          <div class="rail-track"><div class="rail-fill a" id="rail-a" style="width:0%"></div></div>
          <span class="rail-val a" id="rail-val-a">0 / —</span>
        </div>
        <div class="rail-row">
          <span class="rail-agent-tag b">B</span>
          <div class="rail-track"><div class="rail-fill b" id="rail-b" style="width:0%"></div></div>
          <span class="rail-val b" id="rail-val-b">0 / —</span>
        </div>
      </div>
    </div>

    <div class="kpi-grid" id="kpi-grid"></div>
    <div id="winner-banner"></div>
    <div id="episode-summary"></div>
    <div id="bar-chart-summary"></div>
  `;

  const grid = document.getElementById('kpi-grid');
  LIVE_KPI_CONFIG.forEach(kpi => {
    grid.innerHTML += `
      <div class="kpi-card" id="card-${kpi.key}">
        <div class="kpi-header">
          <div class="kpi-title">${kpi.label}</div>
          <div class="kpi-unit-tag">${kpi.unit}</div>
        </div>
        <div class="kpi-row">
          <div class="kpi-side">
            <div class="kpi-side-label a">Agent A</div>
            <div class="kpi-val a" id="val-a-${kpi.key}">—</div>
          </div>
          <div class="kpi-side">
            <div class="kpi-side-label b">Agent B</div>
            <div class="kpi-val b" id="val-b-${kpi.key}">—</div>
          </div>
        </div>
        <div class="kpi-bar-wrap">
          <div class="kpi-bar a" id="bar-a-${kpi.key}" style="width:50%"></div>
          <div class="kpi-bar b" id="bar-b-${kpi.key}" style="width:50%"></div>
        </div>
        <div class="kpi-desc">${kpi.desc}</div>
      </div>
    `;
  });
}

function updateScoreboard(dataA, dataB, finished) {
  if (!dataA && !dataB) return;

  const step    = dataA?.step  ?? dataB?.step  ?? 0;
  const stime   = dataA?.sim_time ?? dataB?.sim_time ?? 0;
  const simInfo = document.getElementById('sim-info');
  if (simInfo) simInfo.textContent = `Step ${step} · ${stime.toFixed(0)}s`;

  // Progress rails
  const pct = Math.min(100, (step / MAX_STEPS) * 100).toFixed(1);
  const rA = document.getElementById('rail-a');
  const rB = document.getElementById('rail-b');
  const rvA = document.getElementById('rail-val-a');
  const rvB = document.getElementById('rail-val-b');
  if (rA) { rA.style.width = pct + '%'; rvA.textContent = `${step}`; }
  if (rB) { rB.style.width = pct + '%'; rvB.textContent = `${step}`; }

  LIVE_KPI_CONFIG.forEach(kpi => {
    const vA = dataA?.[kpi.key] ?? null;
    const vB = dataB?.[kpi.key] ?? null;

    const elA  = document.getElementById(`val-a-${kpi.key}`);
    const elB  = document.getElementById(`val-b-${kpi.key}`);
    const barA = document.getElementById(`bar-a-${kpi.key}`);
    const barB = document.getElementById(`bar-b-${kpi.key}`);

    if (!elA || !elB) return;

    elA.textContent = vA !== null ? fmt(vA) : '—';
    elB.textContent = vB !== null ? fmt(vB) : '—';

    if (vA !== null && vB !== null && (vA + vB) > 0) {
      const total = vA + vB;
      barA.style.width = `${(vA / total * 100).toFixed(1)}%`;
      barB.style.width = `${(vB / total * 100).toFixed(1)}%`;
    }

    if (finished && vA !== null && vB !== null) {
      const aWins = kpi.lowerBetter ? vA < vB : vA > vB;
      const bWins = kpi.lowerBetter ? vB < vA : vB > vA;
      elA.classList.remove('winner-a', 'loser');
      elB.classList.remove('winner-b', 'loser');
      if (aWins)      { elA.classList.add('winner-a'); elB.classList.add('loser'); }
      else if (bWins) { elB.classList.add('winner-b'); elA.classList.add('loser'); }
    }
  });

  if (finished) {
    showWinner(dataA, dataB);
    showEpisodeSummary(dataA, dataB);
    showBarCharts(dataA, dataB);
  }
}

function showWinner(dataA, dataB) {
  if (!dataA || !dataB) return;
  let scoreA = 0, scoreB = 0;

  SUMMARY_KPI_CONFIG.forEach(kpi => {
    const vA = dataA[kpi.key], vB = dataB[kpi.key];
    if (vA == null || vB == null) return;
    if (kpi.lowerBetter) { if (vA < vB) scoreA++; else if (vB < vA) scoreB++; }
    else                  { if (vA > vB) scoreA++; else if (vB > vA) scoreB++; }
  });

  const banner = document.getElementById('winner-banner');
  banner.style.display = 'block';
  banner.className = '';

  if (scoreA === scoreB) {
    banner.innerHTML = `
      <div class="winner-label">Result</div>
      <div class="winner-name" style="color:var(--text)">Draw</div>
      <div class="winner-reason">${agentALabel} ${scoreA}–${scoreB} ${agentBLabel}</div>
    `;
  } else {
    const aWins  = scoreA > scoreB;
    const winner = aWins ? agentALabel : agentBLabel;
    const color  = aWins ? 'var(--a)' : 'var(--b)';
    const ratio  = aWins ? `${scoreA}–${scoreB}` : `${scoreB}–${scoreA}`;
    banner.classList.add(aWins ? 'win-a' : 'win-b');
    banner.innerHTML = `
      <div class="winner-label">Winner</div>
      <div class="winner-name" style="color:${color}">${winner}</div>
      <div class="winner-reason">Won ${ratio} episode KPIs</div>
    `;
  }
}

function showEpisodeSummary(dataA, dataB) {
  const el = document.getElementById('episode-summary');
  if (!el) return;

  let rows = '';
  SUMMARY_KPI_CONFIG.forEach(kpi => {
    const vA = dataA?.[kpi.key] ?? null;
    const vB = dataB?.[kpi.key] ?? null;
    if (vA === null && vB === null) return;

    const aWins = vA !== null && vB !== null && (kpi.lowerBetter ? vA < vB : vA > vB);
    const bWins = vA !== null && vB !== null && (kpi.lowerBetter ? vB < vA : vB > vA);
    const suffix = kpi.unit ? ` ${kpi.unit}` : '';

    rows += `
      <tr>
        <td>${kpi.label}</td>
        <td class="${aWins ? 'win' : bWins ? 'lose' : ''}">${vA !== null ? fmt(vA) + suffix : '—'}</td>
        <td class="${bWins ? 'win' : aWins ? 'lose' : ''}">${vB !== null ? fmt(vB) + suffix : '—'}</td>
      </tr>
    `;
  });

  el.style.display = 'block';
  el.innerHTML = `
    <div class="summary-header">Episode summary</div>
    <table class="summary-table">
      <thead>
        <tr>
          <th>Metric</th>
          <th class="col-a">${agentALabel}</th>
          <th class="col-b">${agentBLabel}</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="summary-note">Averages computed across all simulation steps · winner determined from these values</div>
  `;
}

function showBarCharts(dataA, dataB) {
  const el = document.getElementById('bar-chart-summary');
  if (!el) return;

  let charts = '';
  SUMMARY_KPI_CONFIG.forEach(kpi => {
    const vA = dataA?.[kpi.key] ?? null;
    const vB = dataB?.[kpi.key] ?? null;
    if (vA === null || vB === null) return;

    const max = Math.max(vA, vB);
    if (max === 0) return;

    const aWins = kpi.lowerBetter ? vA < vB : vA > vB;
    const bWins = kpi.lowerBetter ? vB < vA : vB > vA;
    const pctA = ((vA / max) * 100).toFixed(1);
    const pctB = ((vB / max) * 100).toFixed(1);
    const suffix = kpi.unit ? ` ${kpi.unit}` : '';

    charts += `
      <div class="bar-chart-item">
        <div class="bar-chart-item-title">${kpi.label}</div>
        <div class="bar-group">
          <div class="bar-row">
            <div class="bar-row-label a">A</div>
            <div class="bar-track"><div class="bar-fill ${aWins ? 'win-a' : 'a'}" style="width:${pctA}%"></div></div>
            <div class="bar-value ${aWins ? 'win' : 'a'}">${fmt(vA)}${suffix}</div>
          </div>
          <div class="bar-row">
            <div class="bar-row-label b">B</div>
            <div class="bar-track"><div class="bar-fill ${bWins ? 'win-b' : 'b'}" style="width:${pctB}%"></div></div>
            <div class="bar-value ${bWins ? 'win' : 'b'}">${fmt(vB)}${suffix}</div>
          </div>
        </div>
      </div>
    `;
  });

  el.style.display = 'block';
  el.innerHTML = `
    <div class="summary-header">Performance comparison</div>
    <div class="bar-chart-grid">${charts}</div>
  `;
}

// ── Helpers ───────────────────────────────────────────────────────────
function fmt(v) {
  if (v === null || v === undefined) return '—';
  if (Number.isInteger(v) || Math.abs(v) >= 100) return Math.round(v).toLocaleString();
  return v.toFixed(2);
}

function setPill(cls, text) {
  const pill = document.getElementById('status-pill');
  pill.className = `status-pill ${cls}`;
  pill.textContent = text;
}
</script>
</body>
</html>
